<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07090c" />
    <title>Page not found — Reid Thomas</title>
    <meta
      name="description"
      content="The requested page could not be found. Return to Reid Thomas's portfolio."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient__grid"></div>
      <div class="ambient__glow ambient__glow--one"></div>
      <div class="ambient__noise"></div>
    </div>
    <main class="not-found shell">
      <a
        class="nav__brand"
        href="/"
        aria-label="Return to Reid Thomas's portfolio"
      >
        <span class="nav__mark">RT</span>
        <span class="nav__identity">
          <strong>Reid Thomas</strong><small>Systems / Software</small>
        </span>
      </a>
      <div class="not-found__content" data-reveal>
        <p class="eyebrow"><span>404 / Route unavailable</span></p>
        <h1>
          That path left<br />
          the system.
        </h1>
        <p>
          The requested page does not exist or may have moved. The portfolio is
          still online.
        </p>
        <a class="button button--primary" href="/">
          Return to portfolio <i aria-hidden="true">↗</i>
        </a>
      </div>
      <p class="not-found__status"><i></i>Interface online / Route missing</p>
    </main>
    <script src="/main.js" defer></script>
  </body>
</html>
